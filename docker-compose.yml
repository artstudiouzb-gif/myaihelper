# Для VPS: бот + Caddy (автоматический HTTPS-сертификат для вашего домена).
# В .env должен быть указан DOMAIN, а WEBAPP_URL=https://<DOMAIN>
services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN} --to bot:8080
    volumes:
      - caddy_data:/data
    depends_on:
      - bot

volumes:
  caddy_data:
